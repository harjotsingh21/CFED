[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cfed"
version = "1.0.0"
description = "This is a Python package to estimate the Average Temperature Response over 100 years (ATR100) per unit fuel or kilometers traversed for different aviation-related climate forcers, i.e. CO2, H2O, NOx, and Contrail-induced cirrus (CiC). The function is designed to be suitable for integration in the aircraft engine design framework."
authors = [
  { name = "Harjot Singh Saluja" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "==3.12.13"
dependencies = [
    "numpy",
]


[tool.ruff]
line-length = 99
src = ["cfed"]
include = ["pyproject.toml", "cfed/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["cfed"]
force-sort-within-sections = true

